<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jinunpark</title>
  <link rel="alternate" hreflang="ko" href="https://jinunpark.github.io/ko/">
  <link rel="alternate" hreflang="en" href="https://jinunpark.github.io/en/">
  <!--
    lang-detect.js is loaded synchronously in <head> (not deferred) so the redirect
    fires immediately before any body content is painted. JS-disabled users see the
    <noscript> block in <body> instead.
  -->
  <script src="/assets/js/lang-detect.js"></script>
</head>
<body>
  <noscript>
    <p>Choose your language: <a href="/ko/">한국어</a> | <a href="/en/">English</a></p>
  </noscript>
</body>
</html>
