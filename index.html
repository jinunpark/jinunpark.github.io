---
layout: none
sitemap: false
permalink: /
page_id: root-redirect
lang-exclusive: [ko]
---
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
  <link rel="alternate" hreflang="ko" href="{{ site.url }}/ko/">
  <link rel="alternate" hreflang="en" href="{{ site.url }}/en/">
  <!--
    lang-detect.js is loaded synchronously in <head> (not deferred) so the redirect
    fires immediately before any body content is painted. JS-disabled users see the
    <noscript> block in <body> instead.
  -->
  <script src="{{ '/assets/js/lang-detect.js' | relative_url }}"></script>
</head>
<body>
  <noscript>
    <p>Choose your language: <a href="/ko/">한국어</a> | <a href="/en/">English</a></p>
  </noscript>
</body>
</html>
