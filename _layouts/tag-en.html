<!-- _layouts/tag-en.html -->
---
layout: default-en
---
<div class="tag-page__title">
  Tag: <span>{{ page.tag }}</span>
</div>

{% assign tagged = site.posts | where: "lang", "en" | where_exp: "p", "p.tags contains page.tag" %}
{% for post in tagged %}
<div class="post-card">
  <div class="post-card__meta">
    <time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: "%Y-%m-%d" }}</time>
  </div>
  <h2 class="post-card__title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
</div>
{% endfor %}
