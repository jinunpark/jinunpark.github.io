<!-- _layouts/default-ko.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/theme-ko.css' | relative_url }}">

  <!-- hreflang -->
  <link rel="alternate" hreflang="ko" href="{{ site.url }}{{ page.url }}">
  {% if page.url contains "/ko/" %}
  {% assign en_url = page.url | replace: "/ko/", "/en/" %}
  <link rel="alternate" hreflang="en" href="{{ site.url }}{{ en_url }}">
  {% endif %}
</head>
<body>
  {% include header-ko.html %}
  <main class="site-main">
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>© {{ 'now' | date: "%Y" }} {{ site.title }}</p>
  </footer>
</body>
</html>
