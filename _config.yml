# _config.yml
url: "https://jinunpark.github.io"
baseurl: ""

title: "Jinun Park's Blog"
description: "개발과 일상 / Dev & Life"

# jekyll-polyglot
languages: ["ko", "en"]
default_lang: "ko"
# docs/ excluded so spec/plan files don't appear in the built site
exclude_from_localization: ["assets", "scripts", "hooks", "docs"]
# false avoids a known jekyll-polyglot race condition on shared plugin state (e.g. tag generator).
# Doubles build time as site grows but ensures correctness. Do not set to true.
parallel_localization: false

# Posts
# Each post sets an explicit permalink in its front matter with the language prefix
# for ko (default lang) or without the prefix for en (polyglot adds /en/ automatically).
permalink: /:year/:month/:day/:slug/

# Build
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-polyglot

exclude:
  - Gemfile
  - Gemfile.lock
  - "*.sh"
  - hooks/
  - scripts/
  - docs/
  - theme-preview.html
  - README.md
